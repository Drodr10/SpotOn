# Read-only in effect: compares supabase/migrations with production's migration history.
# Fails on DRIFT (production has a migration the repo doesn't: a SQL-editor
# change, or a migration applied from an unmerged branch) and lists what the
# deploy workflow would apply. Changes nothing. See supabase/MIGRATIONS.md.
name: migrations (production check)

# NOT on pull_request: a PR can edit this workflow or the script, so running
# it with production credentials would hand them to anyone who can push a
# branch. Only code already on main runs with them, through the
# `production-check` environment (deployment branches: main only).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migrations-remote-only.txt'
      - '.github/scripts/migration_drift.py'
      - '.github/workflows/migrations-*.yml'
  # Daily, so a change made in the dashboard shows up within a day even when
  # nobody touches migrations.
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-migrations-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not a secret: it is in every app build's Supabase URL.
  PROJECT_REF: ufyphzxophtiryeaqpkr

jobs:
  check:
    name: production drift + pending
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Secrets live on this environment, not the repo, and it only accepts main.
    environment: production-check
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets configured?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to the production-check environment (see supabase/MIGRATIONS.md)"
            exit 1
          fi

      # Same CLI version as the database (pgTAP) job in ci.yml.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0

      - name: Link production
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Compare with production history
        run: |
          set -o pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            | python3 .github/scripts/migration_drift.py
