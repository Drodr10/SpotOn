<!-- SpotOn password reset email. The app's reset flow asks for the 6-digit
     code ({{ .Token }}), not a link, so this template deliberately has no
     {{ .ConfirmationURL }}. Hosted projects don't read this file: paste it into
     Dashboard > Authentication > Emails > Reset Password. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #000;">
  <h2 style="font-weight: 600; margin: 0 0 16px;">SpotOn</h2>
  <p style="margin: 0 0 12px;">Your SpotOn password reset code is:</p>
  <p style="font-size: 32px; font-weight: 600; letter-spacing: 6px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0 0 12px;">Enter it in the SpotOn app. It expires in 1 hour.</p>
  <p style="margin: 0; color: #666;">If you didn't ask for this, ignore this email. Your password won't change.</p>
</div>
